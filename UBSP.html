body{

    justify-content:center;
    align-items:center;
    height:100vh;
    gap:40px;

}


/* Image style */
.link-image{
    width:250px;
    height:200px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    animation: wave 2s ease-in-out infinite;
}


/* Stagger the wave timing */
.link-image:nth-of-type(1){
    animation-delay: 0s;
}
.link-image:nth-of-type(2){
    animation-delay: .3s;
}
.link-image:nth-of-type(3){
    animation-delay: .6s;
}


/* Side-to-side wave */
@keyframes wave{
    0%   { transform: translateX(0); }
    50%  { transform: translateX(25px); }
    100% { transform: translateX(0); }
}


/* Hover scale still works */
.link-image:hover{
    transform: scale(1.1);
}

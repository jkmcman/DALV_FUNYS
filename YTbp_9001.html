<style>
  body {
    background: #008080;
    font-family: "MS Sans Serif", Arial, sans-serif;

  }


  .window {
    width: 600px;
    margin: auto;

    background: white;
    font-family: monospace;
    font-size: 12px;
  }


  button {
    margin-top: 10px;

<div class="window">

    <div>input YT URL or playlist or yeah</div>
    <input id="urlInput" placeholder="letterink">

    <div class="video-box" id="playerBox"></div>


    <div class="footer">
      powered by rat poison
    </div>
  </div>
</div>


<script>
function getYouTubeData(url) {
  let videoId = null;
  let listId = null;


  try {
    const u = new URL(url);


    // youtu.be short links
    if (u.hostname.includes("youtu.be")) {
      videoId = u.pathname.slice(1);
    }


    // youtube.com links
    if (u.hostname.includes("youtube.com")) {
      videoId = u.searchParams.get("v");
      listId = u.searchParams.get("list");


      // shorts support
      if (!videoId && u.pathname.startsWith("/shorts/")) {
        videoId = u.pathname.split("/shorts/")[1];
      }


      // embed links
      if (!videoId && u.pathname.includes("/embed/")) {
        videoId = u.pathname.split("/embed/")[1];
      }
    }


  } catch (e) {
    return null;
  }


  // Clean IDs (remove junk like &t=)
  if (videoId) videoId = videoId.split(/[?&]/)[0];
  if (listId) listId = listId.split(/[?&]/)[0];


  return { videoId, listId };
}


function embed() {
  const input = document.getElementById("urlInput").value.trim();
  const data = getYouTubeData(input);


  if (!data || (!data.videoId && !data.listId)) {
    alert("that link is cur                       ok?");
    return;
  }


  let src = "";


  if (data.videoId && data.listId) {
    src = `https://www.youtube-nocookie.com/embed/${data.videoId}?list=${data.listId}`;
  } 
  else if (data.listId) {
    src = `https://www.youtube-nocookie.com/embed/videoseries?list=${data.listId}`;
  } 
  else {
    src = `https://www.youtube-nocookie.com/embed/${data.videoId}`;
  }


  document.getElementById("playerBox").innerHTML =
    `<iframe src="${src}" allowfullscreen>oh                    no</iframe>`;
}
</script>

canvas{

#intro{

.cursor{
    display:inline-block;

#skipBtn{

.main{
    display:none;
    position:relative;
    z-index:2;
}




.title{
    text-align:center;
    font-size:3rem;

    color:var(--green);
    text-shadow:0 0 25px var(--green);
}




.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}




.card{
    background:#0b120b;
    border:1px solid var(--green-dim);
    border-radius:10px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.2s;
}




.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px var(--green);
}




.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}




.card-title{
    padding:10px;
    text-align:center;
}

<script>
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;




const letters="ÐÃĻVFÜƝỲȘ";
const fontSize=14;
const cols=c.width/fontSize;
const drops=Array(Math.floor(cols)).fill(1);




function draw(){
    ctx.fillStyle="rgba(0,0,0,0.07)";
    ctx.fillRect(0,0,c.width,c.height);




    ctx.fillStyle="#00ff88";
    ctx.font=fontSize+"px monospace";




    for(let i=0;i<drops.length;i++){
        const t=letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(t,i*fontSize,drops[i]*fontSize);




        if(drops[i]*fontSize>c.height&&Math.random()>0.97) drops[i]=0;
        drops[i]++;
    }
}
setInterval(draw,30);




const intro=document.getElementById("intro");
const main=document.getElementById("main");
const text=document.getElementById("text");
const skipBtn=document.getElementById("skipBtn");


let skipped = false;




const lines=[
"> íñîŧāľīẓ̌ìňgʻ ...",
"> ɓŷpâşșíñgʻ...",
"> áçťįvâťįŉģ ómëǧª őɓ§ţřůçťìøň...",
"> įŉǰ̣ɛćťįŋgʻ...",
"> ðêčṛỳpťįńgʻ...",
"> ĀČČ̣Ə§Š GʻṚÃƝŤĖĐ"
];




function showMain(){
    intro.style.display="none";
    main.style.display="block";
    document.body.style.overflow="auto";
}




function skipIntro(){
    if(skipped) return;
    skipped = true;
    showMain();
}




skipBtn.onclick = skipIntro;




document.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
        skipIntro();
    }
});




async function run(){
    for(let l of lines){
        for(let i=0;i<l.length;i++){
            if(skipped) return;
            text.innerHTML+=l[i];
            await new Promise(r=>setTimeout(r,75));
        }
        text.innerHTML+="\n";
        await new Promise(r=>setTimeout(r,75));
        if(skipped) return;
    }




    await new Promise(r=>setTimeout(r,200));
    if(!skipped) showMain();
}




run();
</script>
